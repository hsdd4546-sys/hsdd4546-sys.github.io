<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端，GitHub Pages必备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyd的个人网页</title>
    <style>
        * {
            /* 统一盒模型，消除默认边距 */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 页面背景：淡紫色渐变 */
            background: linear-gradient(135deg, #f0e6ff, #e6d9ff);
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            /* 最小高度撑满屏幕 */
            min-height: 100vh;
            /* 文字行高优化可读性 */
            line-height: 1.6;
        }

        /* 头部：深紫色渐变主题栏 */
        .header {
            text-align: center;
            background: linear-gradient(135deg, #6a0dad, #9370db);
            color: white;
            padding: 30px 20px;
            border-radius: 15px;
            /* 紫色阴影增强质感 */
            box-shadow: 0 4px 15px rgba(106, 13, 173, 0.2);
            /* 过渡动画 */
            transition: transform 0.3s ease;
        }

        .header:hover {
            /* 鼠标悬浮轻微上浮 */
            transform: translateY(-3px);
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        /* 内容区域 */
        .content {
            background-color: white;
            padding: 30px;
            margin-top: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(106, 13, 173, 0.1);
            border: 1px solid rgba(192, 160, 221, 0.3);
        }

        .content h2 {
            /* 标题深紫色 */
            color: #5a189a;
            margin: 20px 0 15px;
            padding-bottom: 8px;
            /* 标题底部淡紫下划线 */
            border-bottom: 2px solid #d8b9ff;
            font-size: 22px;
        }

        .content p {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* 美化兴趣列表 */
        .content ul {
            list-style: none;
            padding-left: 10px;
        }

        .content li {
            padding: 8px 0;
            color: #444;
            font-size: 16px;
            /* 紫色小方块前缀 */
            position: relative;
            padding-left: 20px;
        }

        .content li::before {
            content: "■";
            color: #7b2cbf;
            position: absolute;
            left: 0;
            font-size: 12px;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7b2cbf;
            font-size: 14px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>欢迎来到xyd的个人网页！</h1>
        <p>这是我用GitHub Pages创建的第一个网页</p>
    </div>
    
    <div class="content">
        <h2>关于我</h2>
        <p>大家好，我是【徐艺丹】，一名【工业设计工程】研究生。</p>
        
        <h2>我的兴趣</h2>
        <ul>
            <li>人工智能</li>
            <li>编程开发</li>
            <li>阅读写作</li>
        </ul>
        
        <h2>联系方式</h2>
        <p>邮箱：987052134@qq.com</p>
    </div>
    
    <div class="footer">
        <p>&copy; 2026 我的个人网页 | Powered by GitHub Pages</p>
    </div>
</body>
</html>
